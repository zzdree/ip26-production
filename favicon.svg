<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00d2ff" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Badge -->
  <rect width="64" height="64" rx="16" fill="#121212" stroke="#333333" stroke-width="2"/>
  
  <!-- Broadcast Signal Waves -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00d2ff" stroke-width="2.5" opacity="0.35" stroke-dasharray="4 3"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="url(#glow)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Broadcast Camera Lens Core -->
  <circle cx="32" cy="32" r="7.5" fill="#00d2ff"/>
  <circle cx="29.5" cy="29.5" r="2.5" fill="#ffffff"/>
  
  <!-- Live REC Indicator Dot -->
  <circle cx="48" cy="16" r="4.5" fill="#ef4444" stroke="#121212" stroke-width="1.5"/>
</svg>
